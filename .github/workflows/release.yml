name: Release

# `git tag v1.0.0 && git push origin v1.0.0` 하면 유니버설 앱을 빌드해서 GitHub Release에 올립니다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check localizations
        run: python3 scripts/check-localizations.py

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          UNIVERSAL=1 \
          VERSION="${GITHUB_REF_NAME#v}" \
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}" \
          ./scripts/build-app.sh

      # 릴리스 SDK로 빌드한 앱이 켜지자마자 꺼지는 일이 있었습니다 (2.1.0~2.2.1). 15초 동안 살아 있는지 확인합니다.
      - name: Launch check
        run: |
          dist/Kongi.app/Contents/MacOS/Kongi &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "::error::Kongi quit right after launch (exit $?)"; exit 1
          fi
          kill "$pid"

      - name: Checksum and update signature
        env:
          KONGI_UPDATE_KEY: ${{ secrets.KONGI_UPDATE_KEY }}
        run: |
          cd dist
          # 웹사이트 다운로드 버튼이 쓰는 고정 이름 (releases/latest/download/Kongi.zip)
          cp "Kongi-${GITHUB_REF_NAME#v}.zip" Kongi.zip
          # 앱 안의 업데이트 기능은 이 서명이 맞을 때만 설치합니다.
          # Secrets에 KONGI_UPDATE_KEY가 있으면 여기서 서명하고, 없으면 관리자가 자기 Mac에서 서명해 올립니다
          # (KONGI_UPDATE_KEY=... swift scripts/sign-update.swift Kongi.zip > Kongi.zip.sig → gh release upload).
          if [ -n "$KONGI_UPDATE_KEY" ]; then
            swift ../scripts/sign-update.swift Kongi.zip > Kongi.zip.sig
          fi
          shasum -a 256 *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip $(ls dist/Kongi.zip.sig 2>/dev/null) dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
